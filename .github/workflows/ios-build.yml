name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
            products: Release-iphonesimulator
            artifact: iOS-Simulator
          - name: iOS Device (Unsigned)
            destination: generic/platform=iOS
            products: Release-iphoneos
            artifact: iOS-Device-Unsigned
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select latest installed stable Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          developer_dir=$(python3 - <<'PY'
          import pathlib
          import re

          candidates = []
          for app in pathlib.Path("/Applications").glob("Xcode*.app"):
              match = re.fullmatch(r"Xcode_(27(?:\.\d+)*)\.app", app.name)
              if match:
                  candidates.append((tuple(map(int, match[1].split("."))), app))
          if not candidates:
              raise SystemExit("No stable Xcode 27 installation found")
          print(max(candidates)[1] / "Contents/Developer")
          PY
          )
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Show toolchain and SDK versions
        run: |
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks

      - name: Inspect Apple SDK declarations
        if: matrix.artifact == 'iOS-Simulator'
        run: |
          mkdir -p sdk-reference
          sdk_path=$(xcrun --sdk iphoneos --show-sdk-path)
          for framework in AlarmKit AppIntents ActivityKit CoreHaptics AVFAudio AudioToolbox EventKit Speech WidgetKit; do
            mkdir -p "sdk-reference/$framework"
            find "$sdk_path/System/Library/Frameworks/$framework.framework/Modules" -name '*.swiftinterface' -exec cp {} "sdk-reference/$framework/" \;
          done

          cp -R "$sdk_path/System/Library/Frameworks/EventKit.framework/Headers" sdk-reference/EventKit-Headers
          cp -R "$sdk_path/System/Library/Frameworks/Speech.framework/Headers" sdk-reference/Speech-Headers
          cp -R "$sdk_path/System/Library/Frameworks/AVFAudio.framework/Headers" sdk-reference/AVFAudio-Headers

      - name: Upload SDK reference
        if: matrix.artifact == 'iOS-Simulator'
        uses: actions/upload-artifact@v7
        with:
          name: Apple-SDK-Reference
          path: sdk-reference
          retention-days: 14

      - name: Build Release application
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          xcodebuild \
            -project Nudge.xcodeproj \
            -scheme Nudge \
            -configuration Release \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify built settings and derive artifact version
        id: metadata
        env:
          PRODUCTS: ${{ matrix.products }}
          SUFFIX: ${{ matrix.artifact }}
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import plistlib
          import subprocess
          import re

          app = pathlib.Path("build/Build/Products") / os.environ["PRODUCTS"] / "Nudge.app"
          with (app / "Info.plist").open("rb") as source:
              info = plistlib.load(source)
          assert info["CFBundleIdentifier"] == "com.pavlovilya.nudge"
          assert info["CFBundleShortVersionString"] == "0.5.0"
          expected_builds = set(re.findall(r"CURRENT_PROJECT_VERSION = (\d+);", pathlib.Path("Nudge.xcodeproj/project.pbxproj").read_text()))
          assert expected_builds == {info["CFBundleVersion"]}
          assert info["MinimumOSVersion"] == "26.0"
          icon = info["CFBundleIcons"]["CFBundlePrimaryIcon"]
          assert icon["CFBundleIconName"] == "AppIcon"
          assert icon["CFBundleIconFiles"]
          assert list(app.glob("AppIcon*.png")), "Missing compiled application icon"
          assert (app / "Assets.car").is_file()
          assert info["NSAlarmKitUsageDescription"].strip()
          assert info["NSCalendarsFullAccessUsageDescription"].strip()
          assert info["NSMicrophoneUsageDescription"].strip()
          assert info["NSSpeechRecognitionUsageDescription"].strip()
          assert any(item["UIApplicationShortcutItemType"] == "com.pavlovilya.nudge.voice" for item in info["UIApplicationShortcutItems"])
          extensions = list((app / "PlugIns").glob("*.appex"))
          assert len(extensions) == 1
          extension = extensions[0]
          with (extension / "Info.plist").open("rb") as source:
              widget = plistlib.load(source)
          assert widget["CFBundleIdentifier"] == "com.pavlovilya.nudge.VoiceWidget"
          assert widget["CFBundleIdentifier"].startswith(info["CFBundleIdentifier"] + ".")
          assert widget["CFBundleShortVersionString"] == info["CFBundleShortVersionString"]
          assert widget["CFBundleVersion"] == info["CFBundleVersion"]
          assert widget["MinimumOSVersion"] == "26.0"
          assert widget["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.widgetkit-extension"
          assert (extension / widget["CFBundleExecutable"]).is_file()
          for language in ("ru", "en"):
              assert (extension / f"{language}.lproj/Localizable.strings").is_file()
          assert any("nudge" in entry.get("CFBundleURLSchemes", []) for entry in info["CFBundleURLTypes"])
          assert "audio" not in info.get("UIBackgroundModes", [])
          for language in ("ru", "en"):
              assert (app / f"{language}.lproj/Localizable.strings").is_file()
              with (app / f"{language}.lproj/InfoPlist.strings").open("rb") as source:
                  localized = plistlib.load(source)
                  for key in ("NSCalendarsFullAccessUsageDescription", "NSMicrophoneUsageDescription", "NSSpeechRecognitionUsageDescription", "VOICE_SHORTCUT_TITLE"):
                      assert localized[key].strip()
          for filename in ("nudge-soft.caf", "nudge-prominent.caf", "nudge-silent.caf"):
              sound = app / filename
              assert sound.is_file(), f"Missing sound resource: {sound}"
              assert sound.read_bytes()[:4] == b"caff"
              subprocess.run(["afinfo", str(sound)], check=True)
          artifact = f"Nudge-{info['CFBundleShortVersionString']}-{info['CFBundleVersion']}-{os.environ['SUFFIX']}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"artifact={artifact}\n")
              output.write(f"ipa=Nudge-{info['CFBundleShortVersionString']}-{info['CFBundleVersion']}-Unsigned.ipa\n")
          PYTHON

      - name: Package application bundle
        env:
          PRODUCTS: ${{ matrix.products }}
          ARTIFACT: ${{ steps.metadata.outputs.artifact }}
          IPA: ${{ steps.metadata.outputs.ipa }}
        run: |
          test -d "build/Build/Products/$PRODUCTS/Nudge.app"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/$PRODUCTS/Nudge.app" \
            "artifacts/$ARTIFACT.zip"
          if [ "$PRODUCTS" = "Release-iphoneos" ]; then
            mkdir -p ipa-stage/Payload
            ditto "build/Build/Products/$PRODUCTS/Nudge.app" ipa-stage/Payload/Nudge.app
            (cd ipa-stage && /usr/bin/zip -q -r "../artifacts/$IPA" Payload)
          fi

      - name: Upload application artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Select available iPhone simulator
        if: matrix.artifact == 'iOS-Simulator'
        id: simulator
        run: |
          xcrun simctl list devices available --json > /tmp/simulators.json
          python3 - <<'PYTHON'
          import json
          import os
          import re

          with open("/tmp/simulators.json") as source:
              devices = json.load(source)["devices"]
          candidates = []
          for runtime, entries in devices.items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match or int(match[1]) < 26:
                  continue
              for device in entries:
                  if device["isAvailable"] and device["name"].startswith("iPhone"):
                      candidates.append((int(match[1]), int(match[2]), device["udid"]))
          if not candidates:
              raise SystemExit("No compatible iPhone simulator available for tests")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"id={max(candidates)[2]}\n")
          PYTHON

      - name: Boot test simulator and wait for readiness
        if: matrix.artifact == 'iOS-Simulator'
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Run reminder unit tests
        if: matrix.artifact == 'iOS-Simulator'
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild \
            -project Nudge.xcodeproj \
            -scheme Nudge \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-tests \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Collect simulator launch diagnostics
        if: failure() && matrix.artifact == 'iOS-Simulator'
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          mkdir -p simulator-diagnostics
          xcrun simctl list devices > simulator-diagnostics/devices.txt
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 15m --style compact \
            --predicate 'process == "installd" OR process == "lsd" OR process == "SpringBoard"' \
            > simulator-diagnostics/launch.log 2>&1 || true

      - name: Upload simulator launch diagnostics
        if: failure() && matrix.artifact == 'iOS-Simulator'
        uses: actions/upload-artifact@v7
        with:
          name: Nudge-Simulator-Diagnostics
          path: simulator-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always() && matrix.artifact == 'iOS-Simulator'
        uses: actions/upload-artifact@v7
        with:
          name: Nudge-TestResults
          path: TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14
